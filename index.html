<!doctype html>
<html lang="en" style="background-color: #050505;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jasa Arsitek, Kontraktor, dan Desain Interior Rumah Tropis Premium. Solusi desain dan pembangunan rumah tropis modern yang terpercaya dan profesional di Indonesia." />
    <meta name="keywords" content="Jasa Arsitek, Desain Interior, Rumah Tropis, Bangun Rumah, Arsitektur, Kontraktor Rumah, Konsultan Arsitek, Jasa Bangung Rumah, Desain Eksterior" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Rumah Tropis - Jasa Desain dan Bangun Rumah, Kantor, Ruang Usaha" />
    <meta property="og:description" content="Solusi desain dan pembangunan rumah tropis modern yang terpercaya dan profesional di Indonesia." />
    <meta property="og:type" content="website" />
    <title>Rumah Tropis - Jasa Desain dan Bangun Rumah, Kantor, Ruang Usaha</title>
  </head>
  <body style="background-color: #050505; margin: 0;">
    <div id="root">
      <!-- High-End Luxury Splash Preloader for Rumah Tropis -->
      <div id="initial-preloader" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #050505; color: #ffffff; font-family: 'Playfair Display', Georgia, serif; z-index: 9999; pointer-events: none;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;">
          <img src="/images/logo-rumah-tropis.webp" alt="Rumah Tropis" style="width: 100px; height: auto; opacity: 0; animation: fadeInGold 1.2s ease-out forwards; filter: drop-shadow(0 4px 15px rgba(197, 168, 128, 0.25));" onerror="this.style.display='none';" />
          <h1 style="color: #C5A880; font-size: 18px; letter-spacing: 0.25em; font-weight: 300; margin: 6px 0 0 0; text-transform: uppercase; opacity: 0; animation: fadeInGold 1.2s ease-out 0.3s forwards;">RUMAH TROPIS</h1>
          <span style="color: rgba(255, 255, 255, 0.35); font-size: 8px; letter-spacing: 0.35em; font-weight: 400; text-transform: uppercase; font-family: 'Space Grotesk', system-ui, sans-serif; opacity: 0; animation: fadeInGold 1.2s ease-out 0.6s forwards;">PT TATA RUANG KOTA</span>
          
          <!-- Sleek copper loading line indicator -->
          <div style="width: 70px; height: 1px; background-color: rgba(197, 168, 128, 0.15); position: relative; overflow: hidden; margin-top: 10px; border-radius: 4px;">
            <div style="width: 35%; height: 100%; background-color: #C5A880; position: absolute; left: 0; top: 0; border-radius: 4px; animation: sweepLine 1.6s infinite ease-in-out;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes fadeInGold {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes sweepLine {
          0% { left: -35%; }
          50% { left: 100%; }
          100% { left: -35%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
